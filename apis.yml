name: Ressl
description: >-
  Ressl (ressl.ai) is a Y Combinator-backed platform that provisions hosted mock
  SaaS APIs for AI agents and evaluations. Its control-plane API lets you list
  the mock providers your organization is granted (for example jira, salesforce,
  slack, plus UI clones of Gmail Business and LinkedIn) and create a short-lived
  snapshot of one provider that returns a public HTTPS base URL your agent can
  call - no real customer tenant required. Snapshots carry deterministic or
  seeded synthetic data and expire on a TTL (default one hour, up to seven days).
  Control traffic runs on simulation.ressl.ai; provisioned mock traffic is served
  from *.mock.ressl.cc. Ressl helps teams train, benchmark, and deploy autonomous
  agents by giving them realistic SaaS surfaces to act against safely.
